version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ticket_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketing_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
